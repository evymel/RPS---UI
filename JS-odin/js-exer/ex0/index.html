        // javascript code goes here! look, notation is changed inside the <script> warp!
        console.log("hello world!")

        let str = "STRING"




        function capitalize(str) {
            if (str.length === 0) return ''; // Handle empty string
            else return str[0].toUpperCase() + str.slice(1).toLowerCase();
        }





        console.log(capitalize(str))


    </script>
