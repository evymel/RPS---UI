<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>
</head>
<body>
    <!-- exercise about events - three types-->
    <h1>THE TITLE OF YOUR WEBPAGE</h1>

    <div id="container">
        <!-- this method is less preferable, this type one clutters the html file with JS , also only one "onclick" property per DOM element so we can't run multiple separate funcions -->
        <button onclick="alert('Hello World')">Click Me</button>

        <!-- method two the JS is moved to its file-->
        <button id="btn">Click Me</button>

        <!-- the honorable third method -->
        <button id="btn1">Click Me Too</button>

        <button id="btn2">CLICK ME BABY</button>

    </div>
    

</body>
</html>
